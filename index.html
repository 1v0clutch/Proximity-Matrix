<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Proximity Matrix - ARE 5.0 Style</title>
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>
  <header>
    <h1>Proximity Matrix</h1>
    <p>Select a relationship type, then click cells to define spatial relationships</p>
  </header>

  <main>
    <section id="relationship-modes">
      <div class="mode E selected" data-mode="E">
        <span class="mode-indicator"></span>
        <span class="mode-label">Essential</span>
      </div>
      <div class="mode I" data-mode="I">
        <span class="mode-indicator"></span>
        <span class="mode-label">Important</span>
      </div>
      <div class="mode C" data-mode="C">
        <span class="mode-indicator"></span>
        <span class="mode-label">Convenient</span>
      </div>
      <div class="mode N" data-mode="N">
        <span class="mode-indicator"></span>
        <span class="mode-label">Neutral</span>
      </div>
      <div class="mode S" data-mode="S">
        <span class="mode-indicator"></span>
        <span class="mode-label">Separate</span>
      </div>
      <div class="mode X" data-mode="X">
        <span class="mode-indicator"></span>
        <span class="mode-label">Clear</span>
      </div>
    </section>

    <section class="matrix-container">
      <div class="matrix-pyramid" id="matrix-pyramid"></div>
      <div class="connection-lines" id="connection-lines"></div>
      <div class="space-labels" id="space-labels"></div>
    </section>

    <section class="controls">
      <div class="add-space-form">
        <input 
          id="space-input" 
          type="text" 
          placeholder="Add new space (e.g., Lobby, Kitchen)" 
          maxlength="20"
        />
        <button id="add-space-btn" type="button">Add Space</button>
      </div>
    </section>
  </main>

  <script src="js/matrix.js"></script>
</body>
</html>
